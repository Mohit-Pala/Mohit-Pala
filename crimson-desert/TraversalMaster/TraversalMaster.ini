; Traversal Master for Crimson Desert 2.04.08 (exe 1.0.0.3576).
;
; A fork of Stamina Master (Seth, MIT) that does what Traversal Unbound did:
; cheaper stamina for climbing, swimming, gliding / rocket pack and mounted
; actions, with combat, rolls and sprinting left at the game's own cost.
;
; Unlike Traversal Unbound it patches no game file. It finds those skills by
; name in the running game's skill table, so a patch that shifts the file
; around does not break it.
;
; Skills that give stamina back are never touched, so food and rest restore
; what they always did. The one exception is MountRegenPercent below.
;
; The log is TraversalMaster.log, next to the plugin in bin64. The sessions
; before it are TraversalMaster.01.log upwards, newest first.

;@mod name="Traversal Master" author="Seth, traversal fork" live=0

[settings]

; 1 = only the traversal skills below get cheaper (Traversal Unbound
; behaviour). 0 = Stamina Master behaviour, using UsePercent /
; ContinuousPercent / MountPercent for everything.
;@ type=bool true=1 false=0 label="Traversal only"
TraversalOnly=1

; Cost of the traversal skills as a percentage of the game's own. 25, 50 and
; 75 match Traversal Unbound's variants, and 0 is its infinite variant.
;@ type=int min=0 max=100 unit=% label="Traversal stamina cost"
TraversalPercent=25

; Extra skill keys to include, or default ones to leave out, comma separated.
; Set Probe=1 and the log lists every stamina skill by key.
; e.g. TraversalExtraSkills=Skill_BasicMoveLv4     (sprinting)
; e.g. TraversalExcludeSkills=Skill_Climb_DaggerAttack,Skill_Climb_DaggerChargeAttack
;@ advanced type=string label="Extra traversal skills"
TraversalExtraSkills=
;@ advanced type=string label="Excluded traversal skills"
TraversalExcludeSkills=


; ---- Used only when TraversalOnly=0 ----

; Costs charged once per use: a roll, a jump, each swing of a weapon. 136 of
; them.
;@ type=int min=0 max=100 unit=% label="One-off use costs"
UsePercent=0

; Drains that run for as long as you hold them: sprinting, climbing, swimming,
; the glider, the rocket pack. 62 of them.
;
; It also covers channelled attacks, a held grapple and the war machine's
; flamethrower, because those drain continuously too. The game keeps no flag
; that separates travelling from fighting, so this is drawn on how a cost is
; charged rather than on what the skill is for.
;@ type=int min=0 max=100 unit=% label="Continuous drains"
ContinuousPercent=0

; Anything you do while mounted that costs stamina, held or tapped. 15 of them.
;@ type=int min=0 max=100 unit=% label="Mounted costs"
MountPercent=0

; A horse does not work like you do. Its gait is a recovery rate that falls as
; it speeds up, +100000 a tick standing still and +9000 at a full gallop, and
; its stamina drops at speed because something drains faster than that. Setting
; MountPercent to 0 removes the one mounted cost there is and a galloping horse
; still tires, so this raises the recovery instead.
;
; A percentage of the game's own rate, 100 to 10000, where 100 leaves it alone.
; At 1000 a full gallop recovers 90000 a tick, near enough what standing still
; gives. Traversal Unbound's 25% variant was about 400. Below 100 is
; refused; making a horse tire faster is not what this is
; for.
;@ type=int min=100 max=10000 unit=% label="Mount recovery rate"
MountRegenPercent=400

; Spirit, the blue bar, as a percentage of the game's own cost. The dash while
; gliding, the rocket pack dash, the double jump, the sky kick and the elemental
; skills all spend it, on foot or mounted. 100 leaves Spirit as the game has it
; and 0 makes all of it free. Anything that gives Spirit back is never touched.
;@ type=int min=0 max=100 unit=% label="Spirit costs"
SpiritPercent=100

; Write the research report as well, and a line per number changed with the
; kind it was counted as. Useful for a bug report and noisy otherwise.
;@ advanced type=bool true=1 false=0 label="Research probe"
Probe=0
