; CombatAwareStamina - stamina costs that depend on whether you are fighting.
; Percentages are of the game's own amounts: 100 = vanilla, 0 = free.

[General]
Enabled=1
ToggleKey=0x77              ; F8 toggles the mod in-game (high beep = ON, low beep = OFF). 0 = no hotkey.

[Stamina]
OutOfCombatCostPercent=0    ; 0 = no stamina used outside combat, 25 = quarter cost, 100 = vanilla
InCombatCostPercent=100     ; keep fights vanilla. Lower it if you want cheaper combat too.
OutOfCombatRegenPercent=100 ; 100-10000. e.g. 300 = 3x faster regen out of combat

[Combat]
; You count as "in combat" for TimeoutMs after the last of these signals.
TimeoutMs=6000
DamageSignal=1              ; any actor losing health (you or enemies getting hit)
MinDamage=1                 ; ignore health losses smaller than this (raw game units)
InputSignal=1               ; pressing an attack/guard input
AttackKeys=0x01,0x02        ; Windows VK codes, comma separated. 0x01 = LMB, 0x02 = RMB
GamepadButtons=0xC200       ; XInput mask. 0x4000 X, 0x8000 Y, 0x0200 RB, 0x0100 LB, 0x1000 A, 0x2000 B

; EXPERIMENTAL: a game-side combat byte. No pattern has been verified yet - leave
; blank unless you have confirmed one with Cheat Engine. See docs/RESEARCH.md.
FlagPattern=
FlagRipOffset=3
FlagByteOffset=0x1A
FlagDeref=1

[Hook]
; Shared stat-write commit. Only change these after a game patch breaks the scan
; (the log will say "stat-write hook site not found").
StatWritePattern=48 2B 47 18 48 39 5F 18 48 0F 4F C2 48 89 47 20 48 FF 47 48 48 89 5F 08 48 8B 5C 24 48 48 89 77 38 66 89 6F 50
StatWriteOffset=20
StatWriteFallbackPattern=48 FF 47 48 48 89 5F 08 48 8B 5C 24 48 48 89 77 38
StatWriteFallbackOffset=4
StaminaStatId=17
HealthStatId=0

[Debug]
Verbose=0                   ; 1 = log the first 200 stamina rewrites
